<style>
  /* Układ: jedna kolumna jak ekran telefonu: pasek firmy, potem lista zleceń albo scenka naprawy. */
  :root {
    --bg: #1b1e22; --panel: #272b31; --panel2: #31363d; --line: #454c55;
    --fg: #f4f1e8; --muted: #a8afb8; --hi: #ffc300; --hi-ink: #1b1e22;
    --ok: #6ccf7f; --warn: #ffb74d; --bad: #ef5350;
    --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--body); color: var(--fg); background: var(--bg); font-size: 16px;
    padding-block: 10px 28px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
  h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
  button { font: inherit; font-weight: 700; color: var(--fg); background: var(--panel2); border: 2px solid var(--line); border-radius: 8px; min-height: 48px; padding: 0 12px; cursor: pointer; }
  button:hover:not([disabled]) { border-color: var(--hi); }
  button[disabled] { cursor: not-allowed; opacity: .5; }
  button:focus-visible { outline: 3px solid var(--hi); outline-offset: 2px; }
  .primary { background: var(--hi); color: var(--hi-ink); border-color: #b98f00; border-bottom-width: 5px; font-family: var(--display); font-size: 1.3rem; text-transform: uppercase; letter-spacing: .04em; min-height: 56px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bar h1 { font-size: 1.05rem; letter-spacing: .08em; text-transform: uppercase; color: var(--hi); font-weight: 800; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .stat small { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; display: block; }
  .stat b { font-family: var(--display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }
  .list { display: grid; gap: 8px; }
  .lvl { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; text-align: left; padding: 8px 12px; min-height: 64px; background: var(--panel); }
  .lvl .av { font-size: 1.9rem; text-align: center; }
  .lvl b { display: block; font-family: var(--display); font-size: 1.2rem; }
  .lvl small { display: block; color: var(--muted); font-weight: 500; font-size: .82rem; }
  .lvl .res { text-align: right; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stars { color: var(--hi); letter-spacing: 2px; }
  .scene { background: #cfd8dc; border-radius: 10px; overflow: hidden; border: 2px solid var(--line); }
  .scene svg { display: block; width: 100%; height: auto; }
  .drip { animation: drip 1s infinite; } .drip.d2 { animation-delay: .5s; }
  @keyframes drip { 0% { transform: translateY(-6px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(30px); opacity: 0; } }
  .spark { animation: spark .35s steps(2) infinite; } .spark.s2 { animation-delay: .15s; }
  @keyframes spark { 50% { opacity: .2; } }
  .intro { color: var(--muted); font-size: .95rem; line-height: 1.35; }
  .bubble { background: var(--panel2); border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: start; line-height: 1.35; }
  .bubble .av { font-size: 1.8rem; }
  .steps { display: flex; gap: 6px; }
  .steps i { flex: 1; height: 8px; border-radius: 4px; background: var(--panel2); border: 1px solid var(--line); }
  .steps i.done { background: var(--hi); border-color: var(--hi); } .steps i.cur { border-color: var(--hi); }
  .step h2 { font-size: 1.5rem; text-transform: uppercase; letter-spacing: .03em; }
  .hint { color: var(--muted); font-size: .92rem; }
  .opts { display: grid; gap: 8px; }
  .opt { text-align: left; padding: 10px 12px; line-height: 1.25; display: grid; gap: 4px; min-height: 64px; }
  .opt b { font-size: 1.02rem; } .opt span { color: var(--muted); font-weight: 500; font-size: .88rem; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); font-weight: 700; }
  .chip.skill { color: var(--hi); }
  .tally { display: flex; justify-content: space-between; color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
  .timing { display: grid; gap: 10px; }
  .track { position: relative; height: 44px; background: var(--panel2); border: 2px solid var(--line); border-radius: 10px; overflow: hidden; }
  .zone { position: absolute; top: 0; bottom: 0; background: rgba(255,195,0,.28); }
  .zone.mid { background: rgba(108,207,127,.5); }
  .mark { position: absolute; top: 0; bottom: 0; width: 6px; background: #fff; border-radius: 3px; transform: translateX(-3px); }
  .verdict { text-align: center; font-family: var(--display); font-size: 1.6rem; min-height: 1.4em; }
  .gauge { position: relative; height: 22px; border-radius: 11px; background: linear-gradient(90deg, #6ccf7f 0 15%, #c8d44a 15% 40%, #ff9a3c 40% 70%, #ef5350 70% 100%); border: 2px solid var(--line); }
  .gauge i { position: absolute; top: -8px; width: 6px; height: 34px; background: #fff; border-radius: 3px; transform: translateX(-3px); box-shadow: 0 0 0 2px #000; }
  .glabels { display: flex; justify-content: space-between; font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .bignum { font-family: var(--display); font-weight: 800; font-size: 2.6rem; line-height: 1; }
  .lvname { font-family: var(--display); font-size: 1.6rem; text-transform: uppercase; letter-spacing: .04em; }
  .break { display: grid; gap: 6px; }
  .brow { display: grid; grid-template-columns: 110px 1fr 38px; gap: 8px; align-items: center; font-size: .88rem; color: var(--muted); }
  .brow .b { height: 10px; background: var(--panel2); border-radius: 5px; overflow: hidden; } .brow .b i { display: block; height: 100%; background: var(--warn); }
  .brow b { color: var(--fg); text-align: right; font-variant-numeric: tabular-nums; }
  .defs { display: grid; gap: 4px; font-size: .88rem; }
  .def { display: grid; grid-template-columns: 1fr auto; gap: 8px; color: var(--fg); }
  .tag { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 4px; background: var(--panel2); color: var(--muted); align-self: start; }
  .tag.vis { background: #5a3a1a; color: #ffcc80; } .tag.hid { background: #1d3b52; color: #90caf9; } .tag.haz { background: #5a1f1f; color: #ff8a80; }
  .money { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-variant-numeric: tabular-nums; }
  .money .tot { font-weight: 800; font-family: var(--display); font-size: 1.3rem; border-top: 1px solid var(--line); padding-top: 6px; }
  .modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.72); padding: 16px; z-index: 10; }
  .modal[hidden] { display: none; }
  .modal .card { max-width: 480px; width: 100%; border-color: var(--hi); }
  .modal h2 { color: var(--hi); font-size: 1.5rem; text-transform: uppercase; }
  .modal p { margin: 0; line-height: 1.4; }
  .choices { display: grid; gap: 8px; } .choices button { text-align: left; padding: 10px 12px; line-height: 1.25; }
  .choices small { display: block; color: var(--muted); font-weight: 500; }
  .prow { background: var(--panel2); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
  .prow .hd { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .prow .nm { font-family: var(--display); font-size: 1.2rem; }
  .mbar { height: 8px; border-radius: 4px; background: var(--bg); overflow: hidden; } .mbar i { display: block; height: 100%; background: var(--ok); }
  .mbar.low i { background: var(--bad); } .mbar.mid i { background: var(--warn); }
  .stepper { display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; align-items: center; text-align: center; }
  .stepper b { font-family: var(--display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; } .quick button { min-height: 36px; font-size: .8rem; padding: 0 8px; }
  .warn { color: var(--warn); font-size: .85rem; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tabbtn { min-height: 52px; font-family: var(--display); font-size: 1.15rem; text-transform: uppercase; }
  .tabbtn.alert { border-color: var(--hi); color: var(--hi); }
  .banner { background: #3a2b12; border: 1px solid #7a5b1f; color: #ffcc80; border-radius: 8px; padding: 8px 10px; font-size: .9rem; line-height: 1.35; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; } .grid3 .tabbtn { font-size: .95rem; padding: 0 6px; min-height: 48px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; } .seg button { flex: 1 1 30%; min-height: 48px; font-size: .88rem; line-height: 1.15; padding: 4px 8px; }
  .seg button.on { background: var(--hi); color: var(--hi-ink); border-color: #b98f00; }
  .alle-h { background: #ff5a00; color: #fff; border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; } .alle-h b { font-family: var(--display); font-size: 1.7rem; letter-spacing: .02em; } .alle-h span { font-size: .85rem; opacity: .9; }
  .prow.alle { border: 1px solid #5a3a28; }
  .note { color: var(--muted); font-size: .78rem; text-align: center; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .drip, .spark { animation: none; } }
</style>
