name: Wersja online
# Publikuje grę jako stronę (PWA) na GitHub Pages po wypchnięciu na main albo ręcznie (Actions -> Wersja online -> Run workflow).
# Wymaga w ustawieniach repozytorium: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Testy logiki
        run: for f in tests/*.test.js; do node "$f" > /dev/null || { echo "Test nie przeszedł: $f"; exit 1; }; done
      - name: Budowa wersji online
        run: node tools/zbuduj_web.js web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
